version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./backend:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php
      - frontend

  php:
    image: php:8.1-fpm
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    image: node:alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - '3000:3000'

  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025'

volumes:
  pgdata:
    driver: local
